name: Update Space Shooter GIF

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Space Shooter GIF
        # Using @v1 to get automatic patch updates
        # For reproducible builds, consider pinning to a specific commit hash
        uses: czl9707/gh-space-shooter@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'Hic-Tayfour-space-shooter.gif'
          strategy: 'random'
          fps: '15'
          commit-message: 'Update Hic-Tayfour-space-shooter.gif'

      - name: Verify GIF was generated
        run: |
          if [ ! -f "Hic-Tayfour-space-shooter.gif" ]; then
            echo "Error: Hic-Tayfour-space-shooter.gif was not generated"
            exit 1
          fi
          echo "✅ GIF successfully generated"
          ls -lh Hic-Tayfour-space-shooter.gif
